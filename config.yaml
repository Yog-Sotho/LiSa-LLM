# LiSa-LLM configuration. Start with: lisa --config config.yaml
# Every key can be overridden with an environment variable LISA_<KEY> (e.g. LISA_LISTEN_PORT)
# and some on the command line (--model, --host, --port). Unknown keys are errors.
# The tokenizer is read from the GGUF file; no vocab/merges files are needed.
model_path: "./models/model.gguf"
model_alias: ""     # model id reported by /v1/models and responses; default: file name
# Chat prompt format: empty = the GGUF file's template (ChatML if it has none), or a
# built-in name such as llama3, llama2, chatml, mistral-v7, gemma, phi4, deepseek3.
chat_template: ""

listen_addr: "127.0.0.1"
listen_port: 8080

enable_tls: false
cert_file: ""
key_file: ""
client_ca_file: ""           # set to require client certificates signed by this CA (mTLS)
tls_min_version: "1.2"       # or "1.3"; TLS 1.2 uses forward-secret AEAD suites only

# Clients send a key as "Authorization: Bearer <key>" or "X-API-Key: <key>". Keys can come
# from api_key, api_keys, api_keys_file (one per line) and LISA_API_KEYS (comma-separated).
# An entry may be "sha256:<hex>" instead of the key itself (create one with
# `lisa --hash-key`), so key files need not hold the keys. No key at all disables
# authentication. Off loopback, the server refuses "changeme" and keys under 16 characters.
api_key: "changeme"
api_keys: []
api_keys_file: ""

# Admission control. The model serves one request at a time, in arrival order.
max_queued_requests: 16      # waiting requests; more get 429 with Retry-After
rate_limit_per_minute: 0     # per API key (per address without auth); 0 = unlimited
rate_limit_burst: 10         # requests a key may send at once
max_prompt_tokens: 0         # 0 = limited only by the context window
read_timeout_seconds: 30     # to receive a request
write_timeout_seconds: 60    # per write of a response (slow clients)
keep_alive_timeout_seconds: 5
shutdown_timeout_seconds: 30 # SIGTERM waits this long for running requests; a second
                             # signal stops at once

n_threads: 0                 # 0 = one per available CPU (more only slows it down)
# Continuous batching: requests generated together. Each slot reserves KV cache for
# max_context tokens (e.g. Qwen2.5-0.5B: ~12 KiB/token; Llama-2-7B: ~0.5 MiB/token at f16).
parallel_slots: 4
flash_attention: "auto"      # auto | on | off
kv_cache_type: "f16"         # f16 | q8_0 | q4_0 (halves / quarters KV memory; needs flash attention)
max_context: 4096            # capped at the model's training context
temperature_default: 0.8     # 0 = greedy; used when a request omits temperature
top_p_default: 0.95
max_new_tokens_default: 256  # when a request omits max_tokens (capped by free context)

# Optional: refuse to start unless the model file has this SHA-256 (64 hex digits).
model_sha256: ""

# The model is parsed only inside an isolated worker process (namespaces, read-only empty
# root, Landlock, seccomp). Needs unprivileged user namespaces; see
# docs/project/threat_model.md. If it cannot be set up, the server refuses to start.
sandbox_enabled: true
memory_limit_bytes: 4294967296  # worker heap limit, 4 GiB
sandbox_cgroup: ""              # optional delegated cgroup v2 dir for memory/pids limits
sandbox_seccomp_log: false      # diagnose only: log blocked syscalls instead of killing

use_gpu: true                # needs a CUDA build (-DLISA_CUDA=ON) and sandbox_enabled: false
gpu_layers: -1               # -1 = all layers
