# Container defaults. Mount your model at /models/model.gguf and override this file
# (-v ./my-config.yaml:/etc/lisa/config.yaml:ro) with a strong api_key: the server
# refuses to start on 0.0.0.0 with the placeholder key.
model_path: "/models/model.gguf"

listen_addr: "0.0.0.0"
listen_port: 8080
api_key: "changeme"

n_threads: 0  # one per CPU the container may use
max_context: 4096
temperature_default: 0.8
top_p_default: 0.95
max_new_tokens_default: 256

# The sandbox needs user namespaces, which Docker's default profiles block. To enable it,
# run the container with --security-opt seccomp=unconfined --security-opt apparmor=unconfined
# (LiSa installs a stricter seccomp filter in its worker) and set this to true.
sandbox_enabled: false
use_gpu: true
gpu_layers: -1
