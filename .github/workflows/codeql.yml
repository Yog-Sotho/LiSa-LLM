name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libssl-dev libyaml-cpp-dev libseccomp-dev
      # Fetch and build third-party code before CodeQL starts tracing, so only
      # first-party sources are analysed.
      - name: Configure and build dependencies
        run: |
          cmake --preset release -DLISA_BUILD_TESTS=OFF
          cmake --build --preset release --target llama
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
      - name: Build first-party code
        run: cmake --build --preset release --target lisa
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:c-cpp
