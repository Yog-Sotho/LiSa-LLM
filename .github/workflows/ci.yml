name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 1.2 MB llama model used by the engine tests (tests/test_engine.cpp).
  TEST_MODEL_URL: https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
  TEST_MODEL_SHA256: 270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d
  APT_PACKAGES: ninja-build pkg-config libssl-dev libyaml-cpp-dev libseccomp-dev

jobs:
  build-test:
    name: ${{ matrix.compiler.name }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-13, cc: gcc-13, cxx: g++-13 }
          - { name: clang-18, cc: clang-18, cxx: clang++-18 }
        preset: [asan-ubsan, release]
        include:
          - compiler: { name: gcc-13, cc: gcc-13, cxx: g++-13 }
            preset: tsan
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          read -ra packages <<< "$APT_PACKAGES"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.compiler.name }}-${{ matrix.preset }}
      - name: Download test model
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/stories260K.gguf" "$TEST_MODEL_URL"
          echo "$TEST_MODEL_SHA256  $RUNNER_TEMP/stories260K.gguf" | sha256sum --check
      - name: Configure
        # LISA_NATIVE=OFF: ccache objects must run on any runner CPU.
        run: >
          cmake --preset ${{ matrix.preset }}
          -DLISA_NATIVE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04's AppArmor blocks them by default; the sandboxed worker needs them.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test
        env:
          LISA_TEST_MODEL: ${{ runner.temp }}/stories260K.gguf
          # Fail rather than skip the sandbox tests if the worker can't be isolated.
          LISA_REQUIRE_SANDBOX: "1"
        run: ctest --preset ${{ matrix.preset }}

  coverage:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      # Line coverage of first-party code must stay at or above this.
      MIN_LINE_COVERAGE: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          read -ra packages <<< "$APT_PACKAGES"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends "${packages[@]}"
          pip install gcovr==8.6
      - name: Download test model
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/stories260K.gguf" "$TEST_MODEL_URL"
          echo "$TEST_MODEL_SHA256  $RUNNER_TEMP/stories260K.gguf" | sha256sum --check
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and test with coverage
        env:
          LISA_TEST_MODEL: ${{ runner.temp }}/stories260K.gguf
          LISA_REQUIRE_SANDBOX: "1"
        run: |
          cmake --preset coverage -DLISA_NATIVE=OFF
          cmake --build --preset coverage
          ctest --preset coverage
      - name: Coverage report and gate
        # sandbox.cpp and worker.cpp run only inside the sandboxed worker, which has no
        # filesystem to write coverage data to. The sandbox tests check their effects from
        # outside (escape probes, /proc status, root contents) instead.
        run: |
          mkdir -p coverage
          gcovr --root . --object-directory build/coverage --filter 'src/' \
            --exclude 'src/sandbox\.cpp' --exclude 'src/worker\.cpp' \
            --exclude-throw-branches --print-summary \
            --html-details coverage/index.html \
            --fail-under-line "$MIN_LINE_COVERAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/

  static-analysis:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          read -ra packages <<< "$APT_PACKAGES"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}" clang-tidy-18 clang-format-18 cppcheck
      - name: clang-format
        run: clang-format-18 --dry-run --Werror src/*.cpp src/*.hpp tests/*.cpp tests/*.hpp fuzz/*.cpp
      - name: Configure (compile_commands.json)
        run: cmake --preset dev -DLISA_NATIVE=OFF
      - name: clang-tidy
        run: clang-tidy-18 -p build/dev --quiet src/*.cpp tests/*.cpp
      - name: cppcheck
        run: >
          cppcheck --enable=warning,performance,portability,style --std=c++20
          --inline-suppr --error-exitcode=1 --suppress=missingIncludeSystem
          --suppress=unusedFunction -I src -q src tests fuzz

  workflow-lint:
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint (shellchecks the run steps too)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck
        run: shellcheck packaging/*.sh
      - name: SBOM generator
        run: packaging/sbom.py --version 0.0.0 --arch x86_64 > /dev/null

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - name: Build image
        run: docker build -t lisa-llm:ci .
      - name: Smoke test
        run: |
          docker run --rm lisa-llm:ci --version
          # The bundled container config must refuse the placeholder key on 0.0.0.0.
          if docker run --rm lisa-llm:ci; then
            echo "expected the placeholder api_key to be rejected" >&2
            exit 1
          fi
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Download test model
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/models/model.gguf" "$TEST_MODEL_URL"
          echo "$TEST_MODEL_SHA256  $RUNNER_TEMP/models/model.gguf" | sha256sum --check
      - name: Sandboxed inference inside a locked-down container
        # As in docker-compose.yml (lisa-sandboxed): read-only root, no capabilities,
        # no-new-privileges; only Docker's own seccomp/AppArmor profiles are relaxed so
        # the worker can create its namespaces.
        run: |
          key="$(head -c 24 /dev/urandom | base64 | tr -d '/+=')"
          docker run -d --name lisa -p 18080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -e LISA_SANDBOX_ENABLED=true -e LISA_API_KEY="$key" -e LISA_MAX_CONTEXT=128 \
            -v "$RUNNER_TEMP/models:/models:ro" lisa-llm:ci
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:18080/readyz && break
            sleep 1
          done
          curl -sSf http://127.0.0.1:18080/v1/completions -H "Authorization: Bearer $key" \
            -H 'Content-Type: application/json' \
            -d '{"prompt": "Once upon a time", "max_tokens": 8, "temperature": 0}' | tee response.json
          grep -q '"text_completion"' response.json
          docker logs lisa 2>&1 | grep -q '"Sandboxed worker ready"'
          docker exec lisa /usr/local/bin/lisa --config /etc/lisa/config.yaml --health-check
      - name: Container logs
        if: always()
        run: docker logs lisa 2>&1 | tail -50 || true
